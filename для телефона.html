<style>
/* Layout: полноэкранный 3D-вид, HUD по углам, оверлеи по центру. Одна тёмная тема по задумке. */
:root {
  --ink: #0a0d14;
  --panel: rgba(11, 15, 25, 0.62);
  --panel-line: rgba(255, 255, 255, 0.12);
  --fg: #eef2f7;
  --muted: #9aa8bd;
  --accent: #ff8a3d;
  --nitro: #38d2ff;
  --good: #5be37d;
  --bad: #ff4d5e;
  --display: "HDDisp", "Arial Black", "Segoe UI Black", Impact, sans-serif;
  --body: "HDBody", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: none; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); outline: none; touch-action: none; }
.fx { position: fixed; inset: 0; pointer-events: none; }
#vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 48%, rgba(0,0,0,0.55) 100%); opacity: 0.35; }
#speedlines {
  background: repeating-conic-gradient(from 0deg at 50% 52%, rgba(255,255,255,0) 0deg 5deg, rgba(255,255,255,0.10) 5.4deg 5.9deg, rgba(255,255,255,0) 6.3deg 11deg);
  -webkit-mask-image: radial-gradient(ellipse at 50% 52%, transparent 38%, #000 82%);
  mask-image: radial-gradient(ellipse at 50% 52%, transparent 38%, #000 82%);
  opacity: 0;
}
#flash { background: #ff3b3b; opacity: 0; transition: opacity 0.12s; }
#nitroTint { background: radial-gradient(ellipse at center, rgba(56,210,255,0) 40%, rgba(56,210,255,0.35) 100%); opacity: 0; transition: opacity 0.15s; }

#hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; gap: 12px;
  transition: opacity 0.3s;
}
#hud.off { opacity: 0; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
#score { grid-column: 1; grid-row: 1; justify-self: start; padding: 10px 16px 12px; min-width: 190px; }
#scoreVal { font-family: var(--display); font-size: clamp(26px, 4.2vw, 40px); line-height: 1.05; font-variant-numeric: tabular-nums; }
#scoreRow { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#combo { color: var(--accent); font-family: var(--display); font-size: 16px; transition: transform 0.12s; }
#combo.pop { transform: scale(1.25); }
#lane { color: var(--nitro); font-weight: 700; }
#topRight { grid-column: 2; grid-row: 1; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; max-width: min(520px, 62vw); }
.chip { padding: 6px 11px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; pointer-events: auto; cursor: pointer; }
.chip b { color: var(--accent); font-weight: 800; }
.chip:hover { border-color: rgba(255,255,255,0.3); }
.chip:focus-visible, .tb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#popups { position: fixed; left: 0; right: 0; top: calc(16% + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.pop { font-family: var(--display); font-size: clamp(18px, 3vw, 28px); color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6); animation: rise 1.3s ease-out forwards; }
.pop.gold { color: #ffd166; } .pop.cyan { color: var(--nitro); } .pop.red { color: var(--bad); }
@keyframes rise { 0% { opacity: 0; transform: translateY(10px) scale(0.9); } 12% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }

#bars { grid-column: 1; grid-row: 3; align-self: end; justify-self: start; display: grid; gap: 10px; width: min(300px, 46vw); padding: 12px 14px; }
.bar { display: grid; gap: 4px; }
.track { height: 9px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 100%; transform-origin: left; transition: transform 0.12s linear; }
#hpFill { background: linear-gradient(90deg, #ff4d5e, #ffb347 50%, #5be37d); }
#nitroFill { background: linear-gradient(90deg, #1b8fd6, var(--nitro)); }
#nitroFill.active { box-shadow: 0 0 12px var(--nitro); }
#gauge { grid-column: 2; grid-row: 3; align-self: end; position: relative; width: clamp(170px, 24vw, 250px); aspect-ratio: 1; padding: 0; border-radius: 50%; }
#gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#gaugeText { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding-top: 8%; }
#spd { font-family: var(--display); font-size: clamp(40px, 7vw, 68px); line-height: 1; font-variant-numeric: tabular-nums; min-width: 3ch; }
#gear { font-family: var(--display); font-size: clamp(16px, 2.4vw, 24px); color: var(--accent); }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at 50% 60%, rgba(10,13,20,0.35), rgba(10,13,20,0.82)); touch-action: auto; }
.overlay[hidden] { display: none !important; }
.card { width: min(620px, 100%); padding: 26px 28px; max-height: 94%; overflow: auto; box-sizing: border-box; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 58px); line-height: 1; margin: 0 0 8px; letter-spacing: 0.01em; text-wrap: balance; }
h1 em { color: var(--accent); font-style: normal; }
.sub { color: var(--muted); margin: 0 0 18px; max-width: 52ch; line-height: 1.5; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 22px; margin: 0 0 20px; padding: 0; list-style: none; font-size: 14px; }
.keys li { display: flex; gap: 6px; align-items: center; min-width: 0; flex-wrap: wrap; }
kbd { font-family: var(--body); font-weight: 800; font-size: 12px; padding: 3px 8px; min-width: 26px; text-align: center; border-radius: 5px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); border-bottom-width: 2px; white-space: nowrap; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 16px; letter-spacing: 0.04em; color: #1a0f05; background: var(--accent); border: 0; border-radius: 8px; padding: 13px 24px; cursor: pointer; touch-action: manipulation; }
.btn.alt { background: var(--nitro); color: #04202b; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn[hidden] { display: none; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 14px 0 22px; }
.stats div b { display: block; font-family: var(--display); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.note { margin-top: 12px; font-size: 12px; color: var(--muted); }
.touchonly { display: none; }

/* мобильное управление */
#touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; pointer-events: none;
  padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tg { display: flex; gap: 12px; align-items: flex-end; }
.tg.r { display: grid; grid-template-columns: auto auto; gap: 10px; }
.tb { pointer-events: auto; touch-action: none; width: clamp(68px, 17vmin, 104px); height: clamp(68px, 17vmin, 104px); border-radius: 22px; display: grid; place-items: center;
  background: rgba(11,15,25,0.55); border: 1px solid var(--panel-line); color: #fff; font-family: var(--display); font-size: 12px; letter-spacing: 0.04em; padding: 0; cursor: pointer; }
.tb svg { width: 38%; height: 38%; display: block; }
.tb.wide { width: clamp(96px, 24vmin, 140px); }
.tb.on { background: var(--accent); color: #1a0f05; }
.tb.nitro.on { background: var(--nitro); color: #04202b; }
body.touch.playing #touch { display: flex; }
body.touch .touchonly { display: block; }
body.touch .keys, body.touch kbd { display: none; }
body.touch #bars { grid-row: 2; align-self: start; width: min(240px, 44vw); padding: 8px 12px; gap: 6px; }
body.touch #gauge { grid-row: 2; align-self: start; justify-self: end; width: clamp(70px, 18vmin, 104px); }
body.touch #gauge #spd { font-size: clamp(20px, 5.6vmin, 32px); }
body.touch #spd { font-size: clamp(24px, 6.5vmin, 38px); }
body.touch #gear { font-size: 14px; }
body.touch #topRight { max-width: 70vw; }
@media (max-width: 640px) {
  #hud { grid-template-rows: auto auto auto 1fr; }
  #score { grid-column: 1 / -1; grid-row: 1; }
  #topRight, body.touch #topRight { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; max-width: none; }
  .chip { padding: 5px 9px; font-size: 11px; }
  #bars, body.touch #bars { grid-row: 3; align-self: start; width: min(240px, 52vw); }
  #gauge, body.touch #gauge { grid-row: 3; align-self: start; justify-self: end; width: clamp(96px, 28vw, 130px); }
  #spd, body.touch #spd { font-size: clamp(24px, 8vw, 38px); }
}
@media (max-width: 520px) { .keys { grid-template-columns: 1fr; } .card { padding: 20px 18px; } }
@media (max-height: 460px) { .card { padding: 14px 18px; } .stats { margin: 8px 0 14px; gap: 8px 16px; } .stats div b { font-size: 20px; } .sub { margin-bottom: 10px; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 0.01s; } }

/* ===== v3: меню, настройки, обучение, нитро ===== */
h1, h2 { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.01em; }
h2 { font-size: clamp(24px, 4.6vw, 36px); margin: 0 0 12px; line-height: 1; }
body { font-weight: 500; }
.label { font-weight: 700; }
#scoreVal, #spd, #gear, .pop, .stats div b, #combo { font-style: italic; font-weight: 800; }
.btn { font-style: italic; font-weight: 800; text-transform: uppercase; border-radius: 0; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); padding: 13px 30px; box-shadow: none; }
.btn.ghost { background: rgba(255,255,255,0.14); color: #fff; }
.card.wide { width: min(700px, 100%); }
.panel { border-radius: 8px; }
.overlay.menu { place-items: stretch; padding: 0; background: linear-gradient(90deg, rgba(8,10,16,0.82) 0%, rgba(8,10,16,0.45) 46%, rgba(8,10,16,0) 78%), linear-gradient(0deg, rgba(8,10,16,0.5), rgba(8,10,16,0) 40%); }
.mwrap { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 4vh max(28px, 6vw); width: min(560px, 100%); box-sizing: border-box; }
.logo { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; line-height: 0.92; }
.logo span { display: block; font-size: clamp(34px, 6.4vw, 64px); letter-spacing: 0.06em; color: #fff; }
.logo b { display: block; font-size: clamp(54px, 11vw, 110px); color: var(--accent); letter-spacing: 0.01em; text-shadow: 0 4px 30px rgba(255,138,61,0.35); }
.tagline { margin: 10px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.mnav { display: grid; gap: 10px; width: min(360px, 100%); }
.mbtn { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; cursor: pointer; border: 0; padding: 15px 22px; color: #fff; background: rgba(255,255,255,0.1); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: 0.05em;
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); border-left: 0; transition: background 0.15s, transform 0.15s; }
.mbtn:hover { background: rgba(255,255,255,0.2); transform: translateX(4px); }
.mbtn.primary { background: var(--accent); color: #1a0f05; font-size: 22px; padding: 18px 24px; }
.mbtn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.mbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.mbtn i { font-style: normal; color: #ffd166; font-size: 14px; letter-spacing: 0.04em; }
.mbtn kbd { font-style: normal; }
.todpick { display: flex; gap: 10px; flex-wrap: wrap; }
.tod { cursor: pointer; border: 2px solid transparent; background: rgba(11,15,25,0.55); border-radius: 8px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
.tod i { width: 38px; height: 38px; border-radius: 6px; display: block; }
.tod.t0 i { background: linear-gradient(180deg, #3b3f7a, #ff8f5c 60%, #ffd0a0); }
.tod.t1 i { background: linear-gradient(180deg, #2c7bd4, #86c1f0 60%, #d9ebf8); }
.tod.t2 i { background: linear-gradient(180deg, #03040c, #0a1233 60%, #26356b); }
.tod.on { border-color: var(--accent); background: rgba(255,138,61,0.16); }
.mbest { display: flex; align-items: baseline; gap: 14px; }
.mbest b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
#missList { display: grid; gap: 8px; margin: 0 0 18px; }
.ms { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 14px; }
.ms b { font-weight: 700; }
.ms .st { color: rgba(255,255,255,0.22); letter-spacing: 3px; font-size: 18px; } .ms .st u { text-decoration: none; color: #ffd166; }
.ms .pb { grid-column: 1 / -1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; } .ms .pb i { display: block; height: 100%; background: var(--accent); }
.ms small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
.sl { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; } .sl small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.seg { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }
.seg button.on { background: var(--accent); color: #1a0f05; }
.rng { display: flex; align-items: center; gap: 10px; } .rng input { width: 150px; accent-color: var(--accent); } .rng output { min-width: 3.4ch; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.sw { width: 52px; height: 28px; border-radius: 14px; border: 0; background: rgba(255,255,255,0.2); position: relative; cursor: pointer; flex: none; transition: background 0.15s; }
.sw i { position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.sw[aria-checked="true"] { background: var(--accent); } .sw[aria-checked="true"] i { transform: translateX(24px); }
#settings .btnrow, #missions .btnrow { margin-top: 18px; }
#overMiss { margin: 0 0 14px; color: #ffd166; font-weight: 700; display: grid; gap: 4px; }
.pop.warn { color: #ffb347; font-size: clamp(14px, 2.2vw, 20px); text-align: center; }

/* нитро: заметная клавиша, пульсация, подсказка */
kbd.bigkey { font-size: 13px; padding: 4px 12px; border-radius: 6px; background: rgba(56,210,255,0.16); border: 1px solid var(--nitro); border-bottom-width: 3px; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }
.nl { display: flex; align-items: center; gap: 10px; } .nl em { font-style: normal; margin-left: auto; color: var(--muted); }
.nbar .track { height: 12px; }
.nbar.ready kbd.bigkey { animation: keyp 0.9s ease-in-out infinite; background: var(--nitro); color: #04202b; }
.nbar.ready .nl em { color: var(--nitro); }
.nbar.ready .track { box-shadow: 0 0 0 1px var(--nitro), 0 0 14px rgba(56,210,255,0.55); }
.nbar.active .nl em { color: #fff; } .nbar.active kbd.bigkey { background: #fff; color: #04202b; transform: translateY(2px); border-bottom-width: 1px; }
@keyframes keyp { 0%, 100% { transform: translateY(0); box-shadow: 0 0 0 rgba(56,210,255,0); } 50% { transform: translateY(2px); box-shadow: 0 0 14px rgba(56,210,255,0.9); } }
#nitroHint { position: fixed; left: 50%; bottom: calc(34% + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 14px); display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: rgba(4,32,43,0.8); border: 1px solid var(--nitro); border-radius: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: min(420px, 92vw); box-sizing: border-box; }
#nitroHint.show { opacity: 1; transform: translate(-50%, 0); } #nitroHint kbd { animation: keyp 0.9s ease-in-out infinite; }
body.touch #nitroHint kbd, body.touch #nitroHint .kbonly { display: none; } .kbonly { display: inline; } body.touch .touchonly { display: inline; }
.tb.nitro { position: relative; background: conic-gradient(var(--nitro) calc(var(--n, 0) * 1%), rgba(255,255,255,0.14) 0); color: #fff; }
.tb.nitro::before { content: ''; position: absolute; inset: 5px; border-radius: 17px; background: rgba(8,14,24,0.92); }
.tb.nitro span { position: relative; } .tb.nitro.ready { animation: keyp 0.9s ease-in-out infinite; } .tb.nitro.on { background: conic-gradient(#fff calc(var(--n, 0) * 1%), rgba(255,255,255,0.14) 0); } .tb.nitro.on::before { background: var(--nitro); } .tb.nitro.on span { color: #04202b; }

/* обучение */
#tut { position: fixed; left: 50%; top: calc(24% + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(460px, 92vw); z-index: 5; pointer-events: none; }
#tut[hidden] { display: none; }
.tutcard { background: rgba(8,12,20,0.82); border: 1px solid var(--panel-line); border-radius: 12px; padding: 14px 18px 16px; backdrop-filter: blur(8px); text-align: center; position: relative; transition: box-shadow 0.2s; }
.tutcard.ok { box-shadow: 0 0 0 2px var(--good), 0 0 30px rgba(91,227,125,0.45); }
.tutdots { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; } .tutdots i { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); } .tutdots i.d { background: var(--good); } .tutdots i.c { background: var(--accent); }
.tutkeys { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 46px; flex-wrap: wrap; }
.tutkeys kbd { font-size: 18px; padding: 8px 16px; min-width: 44px; border-bottom-width: 4px; border-radius: 8px; background: rgba(255,255,255,0.14); animation: keypress 1.1s ease-in-out infinite; }
.tutkeys kbd.nit { background: rgba(56,210,255,0.25); border-color: var(--nitro); }
@keyframes keypress { 0%, 55%, 100% { transform: translateY(0); } 70% { transform: translateY(3px); border-bottom-width: 1px; background: var(--accent); color: #1a0f05; } }
.tuttitle { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 22px; margin-top: 8px; }
.tuttext { color: #cdd6e4; margin-top: 4px; line-height: 1.4; font-size: 14px; }
.tutbar { margin-top: 12px; height: 6px; } .tutbar .fill { background: var(--good); transition: transform 0.1s linear; }
.tutskip { pointer-events: auto; position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--muted); font-size: 11px; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; }
.tutskip:hover { color: #fff; }
@media (max-width: 720px) { .overlay.menu { background: linear-gradient(0deg, rgba(8,10,16,0.85), rgba(8,10,16,0.2)); } .mwrap { justify-content: flex-end; gap: 14px; } .logo span { font-size: 30px; } .logo b { font-size: 52px; } .rng input { width: 110px; } }
@media (max-height: 560px) { .mwrap { gap: 10px; } .logo b { font-size: 48px; } .logo span { font-size: 26px; } .tagline { display: none; } .mbtn { padding: 10px 20px; font-size: 15px; } .mbtn.primary { padding: 12px 20px; font-size: 18px; } #tut { top: 17%; width: min(360px, 56vw); } .tutcard { padding: 8px 12px 10px; } .tutdots { margin-bottom: 4px; } .tuttitle { font-size: 16px; margin-top: 4px; } .tuttext { font-size: 12px; margin-top: 2px; } .tutkeys { min-height: 0; } .tutkeys kbd { font-size: 14px; padding: 4px 10px; } .tutbar { margin-top: 8px; } }

/* ===== v4 ===== */
#splash { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 22px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #1a2238, #07090f 70%); transition: opacity 0.4s; }
#splash.gone { opacity: 0; pointer-events: none; } #splash small { color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
.loadbar { width: min(280px, 70vw); height: 5px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin: 0 auto; } .loadbar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 3px; animation: ld 1.2s ease-in-out infinite; }
@keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.cash, .mcash { color: #6bff8e; font-weight: 800; } .mcash { font-family: var(--display); font-style: italic; font-size: 22px; margin-left: auto; } .mcash b { font-weight: 800; margin-left: 2px; }
#cashRow { display: flex; gap: 12px; align-items: baseline; margin-top: 4px; font-size: 14px; } #cashRow .cash { font-family: var(--display); font-style: italic; } #modeTag { color: var(--nitro); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; } #timer { font-family: var(--display); font-style: italic; color: #fff; margin-left: auto; font-size: 20px; } #timer.low { color: var(--bad); }
#vitals { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(330px, 34vw); pointer-events: none; transition: opacity 0.3s; }
#hud.off ~ #vitals, body:not(.playing) #vitals { opacity: 0; }
.vt { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 999px; background: rgba(8,12,20,0.26); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(3px); }
.vt svg { width: 17px; height: 17px; flex: none; } .vt.hp svg { color: #ff5d6e; } .vt.nbar svg { color: var(--nitro); }
.vbar { flex: 1; height: 9px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; } .vbar .fill { border-radius: 5px; }
.vt b { font-style: italic; font-weight: 800; min-width: 3.4ch; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.vt.hp.low { animation: lowhp 0.7s ease-in-out infinite; } @keyframes lowhp { 50% { box-shadow: 0 0 0 1px #ff4d5e, 0 0 16px rgba(255,77,94,0.6); } }
.nbar kbd.bigkey { font-size: 11px; padding: 2px 8px; white-space: nowrap; }
.nbar .vbar { height: 11px; } .nbar.ready .vbar { box-shadow: 0 0 0 1px var(--nitro), 0 0 14px rgba(56,210,255,0.55); } .nbar.ready { border-color: rgba(56,210,255,0.5); }
.roundbtn { pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--panel-line); background: rgba(8,12,20,0.4); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; } .roundbtn svg { width: 20px; height: 20px; } .roundbtn:hover { background: rgba(255,255,255,0.18); }
#topRight { max-width: none; }
.setup { display: grid; gap: 8px; width: min(360px, 100%); } .modedesc { color: var(--muted); font-size: 12px; line-height: 1.4; min-height: 2.8em; }
.mapbtn { display: flex; align-items: center; gap: 12px; border: 1px solid var(--panel-line); background: rgba(11,15,25,0.6); border-radius: 8px; padding: 8px 12px 8px 8px; cursor: pointer; text-align: left; } .mapbtn:hover { border-color: rgba(255,255,255,0.35); }
.mapbtn i { width: 44px; height: 44px; border-radius: 6px; flex: none; } .mapbtn span { display: grid; flex: 1; } .mapbtn small { color: var(--muted); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; } .mapbtn b { font-weight: 800; font-size: 16px; } .mapbtn u { text-decoration: none; color: #ffd166; font-weight: 800; font-size: 13px; }
.setup .seg button { flex: 1; padding: 10px 6px; }
#mapGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0 0 18px; }
.mapcard { border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: rgba(255,255,255,0.06); display: grid; } .mapcard.on { border-color: var(--accent); }
.mapcard .pv { height: 86px; position: relative; } .mapcard .pv::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: rgba(60,60,70,0.85); clip-path: polygon(0 100%, 36% 0, 64% 0, 100% 100%); margin: 0 18%; }
.mapcard .mi { padding: 10px 12px 12px; display: grid; gap: 8px; } .mapcard b { font-family: var(--display); font-style: italic; text-transform: uppercase; font-size: 16px; }
.mapcard .btn { padding: 8px 12px; font-size: 13px; justify-self: start; }
.tabs { display: flex; gap: 6px; margin: 0 0 6px; } .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; font-size: 13px; color: var(--muted); cursor: pointer; } .tabs button.on { color: #fff; border-color: var(--accent); }
.pane[hidden] { display: none; }
.bindrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); } .bindrow > span { flex: 1; font-weight: 600; }
.kslot { min-width: 74px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.22); border-bottom-width: 3px; background: rgba(255,255,255,0.08); cursor: pointer; font-weight: 800; font-size: 12px; text-transform: uppercase; } .kslot.wait { border-color: var(--accent); color: var(--accent); animation: keyp 0.9s infinite; } .kslot:hover { background: rgba(255,255,255,0.16); }
.btn.small { padding: 8px 16px; font-size: 13px; }
.overlay.side { place-items: center start; background: linear-gradient(90deg, rgba(8,10,16,0.8), rgba(8,10,16,0) 75%); } .overlay.side .card { margin-left: max(16px, 4vw); width: min(560px, 100%); }
.ghead { display: flex; align-items: center; } .ghead h2 { margin: 0; } .sub.small { font-size: 12px; margin: 2px 0 10px; }
#paintGrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 6px 0 16px; }
.sw2 { position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; display: grid; place-items: center; padding: 0; color: #fff; font-weight: 800; font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); } .sw2.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); } .sw2 em { font-style: normal; background: rgba(0,0,0,0.55); padding: 2px 5px; border-radius: 4px; }
.up { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); } .up b { font-weight: 700; } .up small { grid-column: 1; color: var(--muted); font-size: 12px; } .pips { display: flex; gap: 4px; } .pips i { width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); } .pips i.f { background: var(--accent); }
.up .btn { grid-column: 2; grid-row: 1 / span 2; padding: 8px 14px; font-size: 13px; } .btn:disabled { opacity: 0.45; cursor: default; filter: grayscale(0.6); }
.btn.money { background: #3ddc6a; color: #052b11; }
.ms .rw { color: #6bff8e; font-weight: 800; font-size: 12px; margin-left: 8px; } .ms .st { white-space: nowrap; }
#overCash { margin: 0 0 12px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; color: #6bff8e; }
.card { background: linear-gradient(180deg, rgba(20,26,40,0.78), rgba(10,14,24,0.78)); }
@media (max-width: 720px) { #vitals { top: calc(134px + env(safe-area-inset-top, 0px)); left: 16px; transform: none; width: min(300px, 58vw); } #mapGrid { grid-template-columns: 1fr; } #paintGrid { grid-template-columns: repeat(5, 1fr); } .overlay.side { place-items: end center; background: linear-gradient(0deg, rgba(8,10,16,0.85), rgba(8,10,16,0) 80%); } .overlay.side .card { margin: 0; max-height: 62%; } }
@media (max-height: 560px) { #vitals { gap: 4px; width: min(300px, 32vw); } .vt { padding: 3px 10px; } }

.mwrap { overflow-y: auto; max-height: 100%; scrollbar-width: none; } .mwrap::-webkit-scrollbar { display: none; }
#settings .btnrow, #garage .btnrow, #missions .btnrow, #maps .btnrow { position: sticky; bottom: -26px; padding: 12px 0 2px; background: linear-gradient(0deg, rgba(10,14,24,0.96) 70%, rgba(10,14,24,0)); margin-top: 8px; z-index: 2; }
@media (max-height: 640px) { .mwrap { gap: 10px; padding-block: 2vh; } .logo span { font-size: 28px; } .logo b { font-size: 52px; } .tagline { display: none; } .mnav { gap: 6px; } .mbtn { padding: 9px 20px; font-size: 15px; } .mbtn.primary { padding: 12px 22px; font-size: 19px; } .modedesc { display: none; } .setup { gap: 6px; } .mapbtn { padding: 5px 10px 5px 5px; } .mapbtn i { width: 34px; height: 34px; } .tod { padding: 4px 10px 4px 4px; } .tod i { width: 28px; height: 28px; } .setup .seg button { padding: 7px 4px; } }

/* ===== iPhone / Safari ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { position: fixed; inset: 0; width: 100%; height: 100%; }
button, .tb, .roundbtn, .mbtn, .seg button { touch-action: manipulation; -webkit-appearance: none; appearance: none; }
.vt, .tutcard, #nitroHint, .roundbtn { -webkit-backdrop-filter: blur(4px); }
.card, .mwrap { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
body.touch .kbonlyrow { display: none !important; }
.mwrap { padding-left: max(28px, 6vw, env(safe-area-inset-left)); }
.overlay { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
#rotHint { display: none; }
@media (orientation: portrait) { body.touch #rotHint { display: block; position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 8; background: rgba(8,12,20,0.8); border: 1px solid var(--panel-line); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap; } body.touch.playing #rotHint { display: none; } }
</style>

</head>
<body>

<canvas id="view" tabindex="0" aria-label="Game"></canvas>
<div class="fx" id="vignette"></div>
<div class="fx" id="speedlines"></div>
<div class="fx" id="nitroTint"></div>
<div class="fx" id="flash"></div>

<div id="hud" class="off">
  <div id="score" class="panel">
    <div class="label" data-t="score">Очки</div>
    <div id="scoreVal">0</div>
    <div id="scoreRow"><span id="dist">0.00</span><span id="combo">×1</span><span id="lane"></span></div>

<script>
'use strict';
/* ============ Утилиты ============ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const col = hex => new THREE.Color(hex).convertSRGBToLinear();
const KMH = 3.6;

/* ============ Геометрия трассы ============ */
/* s — расстояние вдоль трассы (м), d — смещение от оси вправо (м). Ось дороги идёт в сторону -Z. */
const LANE_W = 3.6, ROAD_HALF = 7.2, SHOULDER = 8.4, RAIL = 14.3;
const LANES = [-5.4, -1.8, 1.8, 5.4];          // две встречные полосы слева, две попутные справа
function xc(s) { s = Math.max(0, s); return sstep(0, 900, s) * (130 * Math.sin(s / 380) + 40 * Math.sin(s / 150)); }
function yc(s) { s = Math.max(0, s); return sstep(0, 600, s) * (7 * Math.sin(s / 260 + 0.5) + 3 * Math.sin(s / 101 + 0.7)); }
function xcd(s) { return (xc(s + 1) - xc(s - 1)) * 0.5; }
function ycd(s) { return (yc(s + 1) - yc(s - 1)) * 0.5; }
function curv(s) { const d = xcd(s); return (xc(s + 1) - 2 * xc(s) + xc(s - 1)) / (1 + d * d); }
/* высота рельефа рядом с дорогой */
function terrainH(s, d) {
  const a = Math.abs(d);
  const k = sstep(16, 260, a);
  const n = Math.sin(s * 0.0071 + d * 0.011) * 0.5 + Math.sin(s * 0.0173 - Math.abs(d) * 0.021 + 1.7) * 0.35 + Math.sin(s * 0.0391 + d * 0.037) * 0.15;
  const side = d < 0 ? 1.0 : 0.65;
  return k * (n * 0.5 + 0.55) * 62 * side + sstep(14, 40, a) * Math.sin(s * 0.05 + d * 0.09) * 1.4;
}

/* ============ Рендерер, сцена, камера ============ */
const canvas = $('view');
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android|Mobile/i.test(UA) || (matchMedia('(pointer: coarse)').matches && matchMedia('(hover: none)').matches);
const MAX_DPR = IS_MOBILE ? 1.5 : 1.75;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance', alpha: false, stencil: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.25 : 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = IS_MOBILE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.25, 2600);
scene.add(camera);
function onResize() {
  const w = window.innerWidth || 800, h = window.innerHeight || 600;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => { setTimeout(onResize, 120); setTimeout(onResize, 500); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
onResize();
const game = { mode: 'classic', map: 0 };
function FREE_MODE() { return game.mode === 'free'; }
const cfg = { cam: 0, scheme: 'both', sens: 1, auto: false, vm: 0.8, ve: 1, vf: 1, gfx: 'auto' };
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ============ Небо ============ */
const skyUniforms = {
  top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, hor: { value: new THREE.Color() },
  sunDir: { value: new THREE.Vector3(0, 0.2, -1) }, sunCol: { value: new THREE.Color() }, stars: { value: 0 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: [
    'varying vec3 vDir; uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 sunCol; uniform vec3 sunDir; uniform float stars;',
    'float h(vec3 p){ p = fract(p * 0.3183 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }',
    'void main(){',
    '  vec3 d = normalize(vDir); float y = d.y;',
    '  vec3 c = y > 0.0 ? mix(hor, mid, smoothstep(0.0, 0.2, y)) : hor * 0.85;',
    '  if (y > 0.0) c = mix(c, top, smoothstep(0.14, 0.8, y));',
    '  float sd = max(dot(d, normalize(sunDir)), 0.0);',
    '  c += sunCol * (pow(sd, 1400.0) * 9.0 + pow(sd, 48.0) * 0.5 + pow(sd, 6.0) * 0.22);',
    '  if (stars > 0.0 && y > 0.02) { float s = h(floor(d * 190.0)); c += vec3(step(0.9968, s)) * stars * smoothstep(0.02, 0.3, y); }',
    '  gl_FragColor = vec4(c, 1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <encodings_fragment>',
    '}'
  ].join('\n')
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(1900, 32, 18), skyMat);
skyMesh.frustumCulled = false; skyMesh.renderOrder = -10;
scene.add(skyMesh);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 14), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);

/* ============ Свет ============ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_MOBILE ? 1024 : 2048, IS_MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 260 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.06;
scene.add(sun, sun.target);
const sunDirV = new THREE.Vector3();

const PRESETS = [
  { name: 'Закат', top: '#26356b', mid: '#ff8f5c', hor: '#ffd0a0', sunDir: [-0.38, 0.13, -0.92], sunCol: '#ff9a55', sunInt: 2.7, hemiSky: '#9db0e4', hemiGround: '#6d5040', hemiInt: 0.8, fog: '#f2b98f', fogD: 0.00105, exposure: 1.0, tint: '#ffffff', stars: 0, night: 0 },
  { name: 'День', top: '#2c7bd4', mid: '#86c1f0', hor: '#d9ebf8', sunDir: [0.3, 0.72, -0.6], sunCol: '#fff1dc', sunInt: 3.1, hemiSky: '#cfe6ff', hemiGround: '#7a6a55', hemiInt: 0.95, fog: '#c8deee', fogD: 0.0008, exposure: 0.95, tint: '#ffffff', stars: 0, night: 0 },
  { name: 'Ночь', top: '#03040c', mid: '#0a1233', hor: '#1a2659', sunDir: [0.25, 0.42, -0.87], sunCol: '#7f9cff', sunInt: 0.6, hemiSky: '#2c3d82', hemiGround: '#10131f', hemiInt: 0.55, fog: '#0b1330', fogD: 0.0015, exposure: 1.25, tint: '#9fb4ff', stars: 1, night: 1 }
];
let presetIdx = 0, preset = PRESETS[0];
let envTarget = null;
const groundTint = { value: new THREE.Color(1, 1, 1) };
function applyPreset(i) {
  presetIdx = i; preset = PRESETS[i];
  skyUniforms.top.value.copy(col(preset.top));
  skyUniforms.mid.value.copy(col(preset.mid));
  skyUniforms.hor.value.copy(col(preset.hor));
  skyUniforms.sunCol.value.copy(col(preset.sunCol));
  skyUniforms.stars.value = preset.stars;
  sunDirV.set(preset.sunDir[0], preset.sunDir[1], preset.sunDir[2]).normalize();
  skyUniforms.sunDir.value.copy(sunDirV);
  sun.color.copy(col(preset.sunCol)); sun.intensity = preset.sunInt;
  hemi.color.copy(col(preset.hemiSky)); hemi.groundColor.copy(col(preset.hemiGround)); hemi.intensity = preset.hemiInt;
  scene.fog = new THREE.FogExp2(col(preset.fog).getHex(), preset.fogD);
  scene.fog.color.copy(col(preset.fog));
  if (typeof mapSky === 'function' && typeof MAP !== 'undefined') mapSky();
  renderer.toneMappingExposure = preset.exposure;
  groundTint.value.copy(col(preset.tint));
  if (envTarget) envTarget.dispose();
  envTarget = pmrem.fromScene(envScene, 0.02);
  scene.environment = envTarget.texture;
  if (typeof onPresetApplied === 'function') onPresetApplied();
}

/* ============ Текстуры ============ */
function canvasTex(w, h, draw, srgb) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
/* Асфальт: ширина 16.8 м (с обочинами) по u, период 12 м по v */
const TEXW = 1024, PX_M = TEXW / (SHOULDER * 2);
function rnd(a, b) { return a + Math.random() * (b - a); }
const roadTex = canvasTex(TEXW, 1024, (g, w, h) => {
  g.fillStyle = '#41444b'; g.fillRect(0, 0, w, h);
  // крупные пятна (латки, неоднородность)
  for (let i = 0; i < 70; i++) {
    const v = rnd(48, 74) | 0; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',' + rnd(0.15, 0.35) + ')';
    const x = rnd(0, w), y = rnd(0, h), rw = rnd(30, 140), rh = rnd(20, 90);
    g.beginPath(); g.ellipse(x, y, rw, rh, rnd(0, 3), 0, 6.3); g.fill();
  }
  // заполнитель (щебень)
  for (let i = 0; i < 90000; i++) {
    const v = rnd(32, 118) | 0;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 5) + ',' + rnd(0.25, 0.7) + ')';
    const sz = rnd(0.8, 2.6); g.fillRect(rnd(0, w), rnd(0, h), sz, sz);
  }
  const X = m => (m + SHOULDER) * PX_M;
  // колеи — тёмные, с лёгким глянцем
  LANES.forEach(l => {
    [l - 0.85, l + 0.85].forEach(c => {

let PAINT_HEX = '#ee5a1e';
function buildLivery(def, prof, nExp, paintHex) {
  const W = 2048, H = 1024, L = def.L, cache = {};
  const rg = t => { const k = Math.round(t * 1000); return cache[k] || (cache[k] = ringRight(prof, t, nExp)); };

    g.fillStyle = paintHex; g.fillRect(0, 0, W, H);

    for (let i = 0; i < 400; i++) { g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.025) + ')'; g.fillRect(Math.random() * W, Math.random() * H, 60 + Math.random() * 200, 2 + Math.random() * 10); }
    g.setTransform(W / L, 0, 0, -H / ARC_RANGE, 0, H / 2);          // единицы: метры кузова

    const poly = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); };

    const stripe = (t0, t1, x0, x1, sg) => {
      const top = [], bot = [];
      for (let k = 0; k <= 24; k++) { const t = t0 + (t1 - t0) * k / 24; top.push([t * L, sg * aX(t, x0)]); bot.push([t * L, sg * aX(t, x1)]); }

      line(top, 0.012, '#15110e'); line(bot, 0.012, '#15110e');
    };
    [[0.035, 0.365], [0.8, 0.985]].forEach(([a, b]) => { [1, -1].forEach(sg => stripe(a, b, 0.05, 0.19, sg)); });
    [1, -1].forEach(sg => {
      // колёсные арки: тёмный проём с мягким краем
      def.axles.forEach(az => {
        const tw = (az - (-L / 2)) / L, cy = sg * aY(tw, def.wr), cx = tw * L, rr = def.wr * 1.05;
        const gr = g.createRadialGradient(cx, cy, rr * 0.82, cx, cy, rr * 1.16);
        gr.addColorStop(0, 'rgba(4,4,5,1)'); gr.addColorStop(0.62, 'rgba(4,4,5,0.96)'); gr.addColorStop(1, 'rgba(4,4,5,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rr * 1.16, 0, 6.2832); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 0.008; g.beginPath(); g.arc(cx, cy, rr * 1.02, 0, 6.2832); g.stroke();
      });
      const Y = (t, y) => [t * L, sg * aY(t, y)];
      // швы двери
      const tf = 0.385, tr = 0.625;
      line([Y(tf, belt(tf) - 0.004), Y(tf, 0.3), Y(tf + 0.012, 0.25), Y(tr - 0.012, 0.25), Y(tr, 0.3), Y(tr, belt(tr) - 0.004)], 0.009, '#2a0e05');
      line([Y(tf + 0.004, belt(tf) - 0.01), Y(tf + 0.004, 0.3)], 0.004, 'rgba(255,255,255,0.18)');
      // ручка
      line([Y(0.552, belt(0.57) - 0.11), Y(0.6, belt(0.57) - 0.11)], 0.034, '#17110f');
      line([Y(0.554, belt(0.57) - 0.105), Y(0.598, belt(0.57) - 0.105)], 0.008, '#8e949c');

      for (let k = 0; k < 5; k++) { const y = 0.42 + k * 0.045; line([Y(0.65, y + 0.01), Y(0.71, y - 0.005)], 0.011, '#3a3e45'); }

      g.strokeStyle = '#15110e'; g.lineWidth = 0.01; g.beginPath(); g.arc(cx, cy, 0.125, 0, 6.2832); g.stroke();
      g.save(); g.translate(cx, cy); g.scale(0.01, -0.01); g.fillStyle = '#15110e'; g.font = '800 17px Arial, sans-serif'; g.textAlign = 'center'; g.fillText('27', 0, 6); g.restore();

      g.fillStyle = '#ffb000'; g.beginPath(); g.arc(0.09 * L, aY(0.09, 0.45) * sg, 0.022, 0, 6.2832); g.fill();

    });

function makeParticles(max, additive) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(max * 3), colr = new Float32Array(max * 4), siz = new Float32Array(max);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(colr, 4).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('size', new THREE.BufferAttribute(siz, 1).setUsage(THREE.DynamicDrawUsage));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
  const mat = new THREE.ShaderMaterial({
    uniforms: { scale: { value: 600 } }, transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: 'attribute float size; attribute vec4 color; varying vec4 vC; uniform float scale; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size * scale / max(1.0, -mv.z); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec4 vC; void main(){ vec2 p = gl_PointCoord - 0.5; float r = length(p) * 2.0; float a = smoothstep(1.0, 0.0, r); gl_FragColor = vec4(vC.rgb, vC.a * a * a); }'
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  const P = { n: 0, max, pos, colr, siz, geo, mat,
    px: new Float32Array(max), py: new Float32Array(max), pz: new Float32Array(max),
    vx: new Float32Array(max), vy: new Float32Array(max), vz: new Float32Array(max),
    life: new Float32Array(max), ttl: new Float32Array(max), s0: new Float32Array(max), s1: new Float32Array(max),
    cr: new Float32Array(max), cg: new Float32Array(max), cb: new Float32Array(max), ca: new Float32Array(max), grav: new Float32Array(max), cur: 0 };
  P.emit = function (x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a, grav) {
    const i = P.cur; P.cur = (P.cur + 1) % max;
    P.px[i] = x; P.py[i] = y; P.pz[i] = z; P.vx[i] = vx; P.vy[i] = vy; P.vz[i] = vz;
    P.life[i] = life; P.ttl[i] = life; P.s0[i] = s0; P.s1[i] = s1;
    P.cr[i] = r; P.cg[i] = g; P.cb[i] = b; P.ca[i] = a; P.grav[i] = grav || 0;
  };
  P.update = function (dt) {
    for (let i = 0; i < max; i++) {
      if (P.life[i] <= 0) { siz[i] = 0; colr[i * 4 + 3] = 0; continue; }
      P.life[i] -= dt;
      const k = 1 - P.life[i] / P.ttl[i];
      P.vy[i] -= P.grav[i] * dt;
      const dr = Math.exp(-1.6 * dt);
      P.vx[i] *= dr; P.vz[i] *= dr; if (!additive) P.vy[i] *= dr;
      P.px[i] += P.vx[i] * dt; P.py[i] += P.vy[i] * dt; P.pz[i] += P.vz[i] * dt;
      pos[i * 3] = P.px[i]; pos[i * 3 + 1] = P.py[i]; pos[i * 3 + 2] = P.pz[i];
      siz[i] = lerp(P.s0[i], P.s1[i], k);
      colr[i * 4] = P.cr[i]; colr[i * 4 + 1] = P.cg[i]; colr[i * 4 + 2] = P.cb[i];
      colr[i * 4 + 3] = P.ca[i] * (1 - k) * Math.min(1, k * 8);
    }
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; geo.attributes.size.needsUpdate = true;
  };
  return P;
}

  playerInfo.spin.forEach(s => { s.rotation.x = -car.wheelSpin; });
  if (playerInfo.tail) playerInfo.tail.emissiveIntensity = (car.brake || car.hb ? 3.2 : 0.6) * (preset.night ? 2 : 1);
  const inside = camMode === 2 && state !== 'menu';
  playerInfo.interior.visible = inside; playerInfo.cabin.visible = !inside;
  if (inside) {
    playerInfo.wheelNode.rotation.z = -car.steerIn * 1.5;
    clusterT -= dt;
    if (clusterT <= 0) { clusterT = 0.05; playerInfo.drawCluster(Math.abs(car.u) * KMH, car.rpm, car.gear === 0 ? 'R' : (Math.abs(car.u) < 0.3 && !car.throttle ? 'N' : String(car.gear))); }
  }
  r.visible = true;
}
let clusterT = 0;
function updateTrafficMeshes(dt) {
  for (const a of traffic) {
    if (!a.active) continue;
    const r = a.info.root;
    wp(a.s, a.d, r.position, 0);
    r.rotation.y = -Math.atan(xcd(a.s)) + (a.dir < 0 ? Math.PI : 0) - a.yaw;
    r.rotation.x = Math.atan(ycd(a.s)) * a.dir;
    a.wh = (a.wh || 0) + a.v * dt / 0.4;
    for (const s of a.info.spin) s.rotation.x = -a.wh;
  }
}
function emitFx(dt) {
  if (car.dead && car.hp > 0) return;
  const yaw = carYawWorld(), fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const vx = fx * car.u, vz = fz * car.u;
  playerInfo.root.updateMatrixWorld(true);
  const sl = clamp((Math.abs(car.w) - 2.0) / 6, 0, 1) + (car.hb && car.u > 8 ? 0.6 : 0) + (state === 'play' && car.throttle && car.u < 6 ? 0.35 : 0);
  if (sl > 0.12 && Math.abs(car.u) > 2) {
    const n = Math.min(3, Math.floor(sl * 6 * dt * 60 * 0.25 + Math.random()));
    for (let i = 0; i < n; i++) {
      _pw.set((Math.random() < 0.5 ? -1 : 1) * 0.8, 0.12, 1.38); playerInfo.tilt.localToWorld(_pw);
      smoke.emit(_pw.x, _pw.y, _pw.z, vx * 0.35 + (Math.random() - 0.5) * 2, 0.8 + Math.random() * 1.2, vz * 0.35 + (Math.random() - 0.5) * 2, 0.9 + Math.random() * 0.7, 0.9, 3.8, 0.86, 0.86, 0.88, 0.45, -0.4);
    }
  }
  if (car.offroad && Math.abs(car.u) > 5 && Math.random() < 0.8) {
    _pw.set((Math.random() - 0.5) * 1.6, 0.1, 1.2); playerInfo.tilt.localToWorld(_pw);
    smoke.emit(_pw.x, _pw.y, _pw.z, vx * 0.4 + (Math.random() - 0.5) * 3, 1 + Math.random() * 2, vz * 0.4 + (Math.random() - 0.5) * 3, 0.8, 0.8, 3.2, 0.56, 0.47, 0.34, 0.5, -0.5);
  }
  if (car.nitroOn) {
    for (let s = -1; s <= 1; s += 2) {
      _pw.set(s * 0.5, 0.4, 2.3); playerInfo.tilt.localToWorld(_pw);
      glowFx.emit(_pw.x, _pw.y, _pw.z, vx - fx * 9 + (Math.random() - 0.5) * 1.5, (Math.random() - 0.3) * 1.2, vz - fz * 9 + (Math.random() - 0.5) * 1.5, 0.22, 0.9, 0.2, 0.35, 0.8, 1, 0.9, 0);
    }
  }
  if (car.hp < 35 && Math.random() < dt * 24) {
    _pw.set((Math.random() - 0.5) * 0.8, 0.9, -1.6); playerInfo.tilt.localToWorld(_pw);
    smoke.emit(_pw.x, _pw.y, _pw.z, vx * 0.6 + (Math.random() - 0.5), 1.6 + Math.random(), vz * 0.6 + (Math.random() - 0.5), 1.3, 0.7, 2.6, 0.18, 0.18, 0.18, 0.55, -0.6);

}

/* ============ Игровой цикл ============ */
const HUDc = { score: '', dist: '', combo: '', lane: '', spd: '', gear: '', rpm: -1, hp: -1, nitro: -1 };
function updateGear(dt) {
  const sp = car.u;
  if (sp < -0.6) { car.gear = 0; } else {
    if (car.gear < 1) car.gear = 1;
    let g = car.gear;
    if (sp > GEAR_HI[g - 1] * 0.985 && g < 6) g++; else if (g > 1 && sp < GEAR_HI[g - 2] * 0.62) g--;
    car.gear = g;
  }
  let rpmT;
  if (car.gear === 0) rpmT = 1100 + Math.min(1, Math.abs(car.u) / 10) * 2500;
  else {
    const g = car.gear, lo = g > 1 ? GEAR_HI[g - 2] * 0.62 : 0, hi = GEAR_HI[g - 1];
    rpmT = (g === 1 ? 1000 : 2400) + clamp((sp - lo) / (hi - lo), 0, 1.04) * (g === 1 ? 5800 : 5000);
    if (sp < 3) rpmT = 900 + car.throttle * 3600;
  }
  car.rpm = damp(car.rpm, rpmT, 12, dt);
}
function updateHud(dt) {
  const sc = fmt(car.score); if (sc !== HUDc.score) { HUDc.score = sc; $('scoreVal').textContent = sc; }
  const ds = car.dist.toFixed(2) + ' ' + t('km'); if (ds !== HUDc.dist) { HUDc.dist = ds; $('dist').textContent = ds; }
  const cb = '×' + Math.floor(car.combo); if (cb !== HUDc.combo) { HUDc.combo = cb; $('combo').textContent = cb; }
  const ln = (state === 'play' && car.d < -0.3 && !car.dead) ? t('lane_on') : ''; if (ln !== HUDc.lane) { HUDc.lane = ln; $('lane').textContent = ln; }
  const spd = String(Math.round(Math.abs(car.u) * KMH)); if (spd !== HUDc.spd) { HUDc.spd = spd; $('spd').textContent = spd; }
  const gr = car.gear === 0 ? 'R' : (Math.abs(car.u) < 0.3 && !car.throttle ? 'N' : String(car.gear)); if (gr !== HUDc.gear) { HUDc.gear = gr; $('gear').textContent = gr; }
  const rp = Math.round(clamp(car.rpm / 8000, 0, 1) * 100); if (rp !== HUDc.rpm) { HUDc.rpm = rp; $('rpmArc').setAttribute('stroke-dasharray', rp + ' 100'); $('rpmArc').setAttribute('stroke', rp > 86 ? '#ff4d5e' : '#ff8a3d'); }
  const hp = Math.round(car.hp); if (hp !== HUDc.hp) { HUDc.hp = hp; $('hpFill').style.transform = 'scaleX(' + (hp / 100) + ')'; }
  const nt = Math.round(car.nitro); if (nt !== HUDc.nitro) { HUDc.nitro = nt; $('nitroFill').style.transform = 'scaleX(' + (nt / 100) + ')'; }
  $('nitroFill').classList.toggle('active', car.nitroOn);
  const spd2 = Math.abs(car.u);
  $('speedlines').style.opacity = String(clamp(sstep(38, 82, spd2) * 0.55 + (car.nitroOn ? 0.35 : 0), 0, 0.9));
  $('vignette').style.opacity = String(0.3 + sstep(20, 80, spd2) * 0.5);
  $('nitroTint').style.opacity = car.nitroOn ? '1' : '0';
  nitroUi();
}
function simulate(dt) {
  if (tut.on) tutTick(dt); else { missionTick(dt); modeTick(dt); }
  car.hitCool -= dt; car.shake = Math.max(0, car.shake - dt * 1.8); car.scrape -= dt;
  updateTraffic(dt);
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let i = 0; i < n; i++) { stepCar(h); collideAll(); }
  updateGear(dt);
  if (car.dead) { car.deadT += dt; if (car.deadT > 1.5 && state === 'play') showOver(); return; }
  // очки, комбо, дрифт
  const sp = Math.max(0, car.u);
  car.dist = (car.s - startS) / 1000;
  car.topSpeed = Math.max(car.topSpeed, Math.abs(car.u));
  if (!FREE_MODE()) addScore(sp * dt * 0.25);
  if (Math.abs(car.w) > 2.6 && sp > 14 && !car.offroad) {
    car.driftT += dt; addScore(Math.abs(car.w) * sp * dt * 0.04 * Math.floor(car.combo));
    if (car.driftT > 1.3) { car.driftT = 0; bumpCombo(0.5); popup(t('p_drift'), 'gold'); }
  } else car.driftT = Math.max(0, car.driftT - dt * 2);
  if (car.comboT > 0) car.comboT -= dt; else if (car.combo > 1) car.combo = Math.max(1, car.combo - dt * 1.5);
  if (!car.nitroOn) car.nitro = Math.min(100, car.nitro + dt * (sp > 25 ? 1.6 : 0.4) * (1 + 0.12 * upLvl('nit')));
}
let frameEma = 0.016, lowT = 0, highT = 0, prCur = renderer.getPixelRatio(), prMax = prCur;
function adaptQuality(dt) {
  frameEma = lerp(frameEma, Math.min(dt, 0.1), 0.05);
  if (state === 'menu' || cfg.gfx !== 'auto') return;
  if (frameEma > 1 / 36) { lowT += dt; highT = 0; } else if (frameEma < 1 / 55) { highT += dt; lowT = 0; } else { lowT = 0; highT = 0; }
  if (lowT > 2 && prCur > 0.6) { prCur = Math.max(0.6, prCur - 0.15); renderer.setPixelRatio(prCur); onResize(); lowT = 0; }
  else if (highT > 8 && prCur < prMax) { prCur = Math.min(prMax, prCur + 0.1); renderer.setPixelRatio(prCur); onResize(); highT = 0; }
}
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000;
  let dt = clamp(now - (lastT || now), 0, 0.05); lastT = now;
  if (focusLost && state === 'play') pauseGame();
  adaptQuality(dt);
  simClock += dt;
  if (state === 'play' || state === 'over') simulate(dt);
  if (state === 'over') { /* автомобиль доезжает по инерции */ }
  updateWorld(car.s);
  updatePlayerMesh(dt);
  updateTrafficMeshes(dt);
  if (state === 'play' || state === 'over') { emitFx(dt); smoke.update(dt); glowFx.update(dt); }
  updateCamera(dt);
  updateSkyDeco(dt); updateSnow(dt);
  skyMesh.position.copy(camera.position);
  wp(car.s, car.d, _pw, 0);
  sun.position.set(_pw.x + sunDirV.x * 120, _pw.y + sunDirV.y * 120, _pw.z + sunDirV.z * 120); sun.target.position.copy(_pw);

  smoke.mat.uniforms.scale.value = sc; glowFx.mat.uniforms.scale.value = sc;
  if (state !== 'menu') updateHud(dt);
  sfx.update();
  renderer.render(scene, camera);
}

/* ============ Ввод ============ */
function cycleCam() { camMode = (camMode + 1) % 3; camInit = false; refreshChips(); }
function cycleTod() { saved.tod = (presetIdx + 1) % 3; applyPreset(saved.tod); saveAll(); }
function toggleSound() { initAudio(); sfx.on = !sfx.on; sfx.apply(); saved.snd = sfx.on; saveAll(); refreshChips(); }
function onEnter() {
  initAudio();
  if (ui.open) return;
  if (state === 'menu') startRun(); else if (state === 'over') onAgain(); else if (state === 'pause') resumeGame();
}
addEventListener('keydown', e => {
  const c = e.code;
  if (ui.capture) { e.preventDefault(); captureKey(c); return; }
  if (c === 'ArrowUp' || c === 'ArrowDown' || c === 'ArrowLeft' || c === 'ArrowRight' || c === 'Space') e.preventDefault();
  keys.add(c);
  if (e.repeat) return;
  initAudio();
  if (state === 'play' && (binds.gas[0] === c || binds.gas[1] === c)) { const nw = performance.now(); if (nw - lastGasTap < 300) car.nitroLatch = true; lastGasTap = nw; }
  if (c === 'Enter') onEnter();
  else if (c === 'KeyP' || c === 'Escape') { if (ui.open) closeUi(); else if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); }
  else if (c === 'KeyR') { if (state === 'play' || state === 'pause') startRun(); else if (state === 'over') onAgain(); }
  else if (state === 'play' && binds.cam.indexOf(c) >= 0) cycleCam();
  else if (c === 'KeyM') toggleSound();
});
let lastGasTap = 0;
addEventListener('keyup', e => { keys.delete(e.code); if (!inAct('gas')) car.nitroLatch = false; });
function setFocusLost(v) { focusLost = v; if (v) keys.clear(); applyMute(); }
addEventListener('blur', () => setFocusLost(true));
addEventListener('focus', () => setFocusLost(false));
document.addEventListener('visibilitychange', () => setFocusLost(document.hidden || !document.hasFocus()));
addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', () => { try { canvas.focus(); } catch (e) { } });

function bindHold(el) {
  const code = el.getAttribute('data-key');
  const down = e => { e.preventDefault(); initAudio(); keys.add(code); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (x) { } };
  const up = e => { e.preventDefault(); keys.delete(code); el.classList.remove('on'); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
function enableTouch() {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); autoGas = true; touchMode = true;
}
document.querySelectorAll('[data-key]').forEach(bindHold);
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });   // Enter и Пробел не должны повторно нажимать кнопку
$('goBtn').addEventListener('click', onEnter);
$('againBtn').addEventListener('click', onAgain);
$('resumeBtn').addEventListener('click', resumeGame);
$('reviveBtn').addEventListener('click', onRevive);
$('doubleBtn').addEventListener('click', onDouble);
$('chipPause').addEventListener('click', () => { if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); });


/* ============ iPhone / Safari: жесты, звук, пауза при сворачивании ============ */
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('.card, .mwrap'))) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
let _lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - _lastTouchEnd < 350 && !(e.target.closest && e.target.closest('button, input'))) e.preventDefault(); _lastTouchEnd = n; }, { passive: false });
['touchend', 'pointerup', 'click', 'keydown'].forEach(n => addEventListener(n, () => { initAudio(); }, { passive: true }));
addEventListener('pagehide', () => { if (state === 'play') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { initAudio(); lastT = performance.now() / 1000; } });

/* ============ Запуск ============ */
(async function boot() {
  loadLocal();
  sfx.on = saved.snd; uiInit();
  if (matchMedia('(pointer: coarse)').matches && matchMedia('(hover: none)').matches) enableTouch();
  applySaved();
  applyLang();
  resetRun(); updateWorld(car.s);
  setState('menu');
  requestAnimationFrame(frame);
  await initSDK();
  applyLang(); refreshChips();
  await new Promise(r => setTimeout(r, 700));
  await new Promise(r => showInterstitial(r));        // короткая реклама при входе в игру
  const sp = $('splash'); if (sp) { sp.classList.add('gone'); setTimeout(() => { sp.hidden = true; }, 500); }
  lastT = performance.now() / 1000;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); } catch (e) { }
  }));
})();
